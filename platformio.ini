[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Logo bitmap needs ~47 KB; the default 1.25 MB app slot is nearly full.
; The project has no OTA update code, so the 3 MB single-app layout is safe.
board_build.partitions = huge_app.csv

; Match serial monitor speed
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI @ ^2.5.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl @ ^8.3.11

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; CYD panel powers up inverted (white shows as black)
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; --- DISABLE TFT_eSPI TOUCH TO PREVENT BUS CONFLICT ---
    -D TOUCH_CS=-1
    ; --- SPI FREQUENCIES ---
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; --- LVGL FLAGS ---
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src/