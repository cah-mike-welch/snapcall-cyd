[env:esp32-cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# Hardware: Cheap Yellow Display (CYD) with ESP32-D0WDQ6
# Display: ILI9341 320x240
# Touch: XPT2046

# CPU and Memory
board_build.f_cpu = 240000000L

# Build flags for TFT_eSPI and hardware configuration
build_flags = 
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -Isrc
    -include src/User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DLV_CONF_INCLUDE_SIMPLE=1

# Libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl @ ^8.3.11
    ArduinoJson @ ^7.0.4
    paulstoffregen/XPT2046_Touchscreen

# Specify monitor port (user can override with -m flag)
monitor_port = COM3

# Serial monitor settings
monitor_filters = 
    default
    time
    log2file
