[env:esp32-cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# Hardware: Cheap Yellow Display (CYD) with ESP32-D0WDQ6
# Display: ILI9341 320x240
# Touch: XPT2046

# CPU and Memory
board_build.f_cpu = 240000000L

# Build flags for TFT_eSPI and hardware configuration
build_flags = 
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -DTFT_eSPI_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DTFT_INVERSION_ON

# Libraries
lib_deps =
    TFT_eSPI @ ^2.5.43
    lvgl @ ^8.3.11
    ArduinoJson @ ^7.0.4

# Specify monitor port (user can override with -m flag)
monitor_port = COM3

# Serial monitor settings
monitor_filters = 
    default
    time
    log2file
